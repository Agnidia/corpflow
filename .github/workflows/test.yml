name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a PR push is free; cancelling a master run would leave master unverified.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false        # a macOS failure must not cancel the Linux evidence, or the reverse
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30       # was 20; macOS runners are slower to provision
    steps:
      - uses: actions/checkout@v5
        with:
          # Several bats shell out to git and diff against origin/master.
          fetch-depth: 0

      - name: preflight — jq and python3
        run: |
          command -v jq
          command -v python3

      # tests/shell/skills/cross-plugin-refs.bats resolves every `/<plugin>:<command>`
      # and `Task(<plugin>:<agent>)` this repo names against the sibling that owns it.
      # A bare checkout has no siblings, so without this the contract passed while
      # checking nothing. Best-effort by design: a sibling repo being unreachable is
      # that repo's outage, not a defect in this one, so a failed clone warns and the
      # bats reports the reduced coverage rather than reddening the job.
      - name: shallow-clone sibling plugins
        shell: bash
        run: |
          root="$RUNNER_TEMP/siblings"
          mkdir -p "$root"
          for p in apple-developer system-developer android-developer \
                   frontend-developer backend-developer ai-engineer; do
            git clone --depth 1 --quiet "https://github.com/Agnidia/$p.git" "$root/$p" \
              || echo "::warning::could not clone $p; cross-plugin refs into it stay unverified"
          done
          echo "CORPFLOW_SIBLING_ROOT=$root" >> "$GITHUB_ENV"

      - name: full deterministic suite
        env:
          # Selection is never the required check: the gate is always the full suite.
          CORPFLOW_TEST_SELECT: "0"
        # `shell: bash` is what applies -o pipefail; the implicit default is `bash -e`
        # only, so without it the step exits with tee's status and a red suite reports
        # green. 2>&1 is load-bearing too: run-tests.sh prints SKIPPED PHASES to stderr
        # and the summary step below reads run-tests.log.
        shell: bash
        run: ./run-tests.sh 2>&1 | tee run-tests.log

      - name: report skipped phases
        if: always()
        # Same pipefail reasoning as the step above; here the `|| echo` fallback already
        # absorbs an empty pipeline, so this keeps one shell contract across the job
        # rather than two.
        shell: bash
        run: |
          { echo '### Skipped phases'
            echo
            # always() also fires when preflight failed or the suite was cancelled;
            # with no log the empty-pipeline fallback would claim every phase ran.
            if [ -f run-tests.log ]; then
              awk '/SKIPPED PHASES:/{f=1} f' run-tests.log | grep . \
                || echo 'none — every phase ran'
            else
              echo 'suite did not run — no run-tests.log'
            fi; } >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # Invocation modes follow one rule (architecture-0.md AD-3): a lint runs against
      # its real subject when this repository contains one, against its built-in
      # fixtures when it does not. cache-lint and pr-body-lint exit 2 when invoked bare.
      - name: desc-lint (repo subject)
        run: bash skills/worktask/scripts/desc-lint.sh

      - name: section-lint (repo subject)
        if: always()
        run: bash skills/worktask/scripts/section-lint.sh

      - name: cache-lint (self-test fixtures)
        if: always()
        run: bash skills/worktask/scripts/cache-lint.sh --self-test

      - name: pr-body-lint (self-test fixtures)
        if: always()
        run: bash skills/worktask/scripts/pr-body-lint.sh --self-test

      - name: portability-lint (repo subject)
        if: always()
        run: bash skills/worktask/scripts/portability-lint.sh
